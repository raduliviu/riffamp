<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webamp</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14100e; color: #e8ddd0; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  .card { background: #221a15; border: 1px solid #3a2d24; border-radius: 12px; padding: 2rem 2.5rem; max-width: 34rem; }
  h1 { margin-top: 0; letter-spacing: 0.04em; }
  #status { font-weight: 600; }
  .ok { color: #7dc87d; } .bad { color: #d87d7d; }
  pre { background: #171310; padding: 0.8rem; border-radius: 8px; overflow-x: auto; font-size: 0.8rem; }
</style>
</head>
<body>
<div class="card">
  <h1>webamp</h1>
  <p>Engine connection: <span id="status">connecting…</span></p>
  <pre id="state">–</pre>
</div>
<script>
  const statusEl = document.getElementById("status");
  const stateEl = document.getElementById("state");
  const ws = new WebSocket("ws://127.0.0.1:43717");
  ws.onopen = () => { statusEl.textContent = "connected"; statusEl.className = "ok"; ws.send(JSON.stringify({ type: "hello" })); };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "state") stateEl.textContent = JSON.stringify({ model: msg.model, ir: msg.ir, params: msg.params, engine: msg.engine }, null, 1);
  };
  ws.onclose = (e) => { statusEl.textContent = `closed (${e.code})`; statusEl.className = "bad"; };
  ws.onerror = () => { statusEl.textContent = "engine not found — is webamp-helper running?"; statusEl.className = "bad"; };
</script>
</body>
</html>
