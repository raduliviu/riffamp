<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webamp</title>
<style>
  :root {
    --bg: #14100e; --panel: #221a15; --panel2: #2b211a; --line: #3a2d24;
    --text: #e8ddd0; --dim: #9c8d7c; --accent: #e0a458; --ok: #7dc87d; --bad: #d87d7d;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
         display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1rem; }
  .amp { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
         padding: 1.5rem 2rem; width: min(64rem, 100%); }
  header { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  h1 { margin: 0; letter-spacing: 0.12em; font-size: 1.6rem; }
  h1 span { color: var(--accent); }
  #engineInfo { color: var(--dim); font-size: 0.8rem; }
  #connDot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--bad);
             display: inline-block; margin-right: 0.35rem; }
  #connDot.ok { background: var(--ok); }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: stretch; }
  .section { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
             padding: 0.9rem 1.1rem; margin-bottom: 1rem; }
  .section h2 { margin: 0 0 0.7rem; font-size: 0.72rem; letter-spacing: 0.18em;
                color: var(--dim); text-transform: uppercase; }
  /* channel buttons */
  .channels { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .channels button { background: var(--panel); color: var(--text); border: 1px solid var(--line);
                     border-radius: 8px; padding: 0.55rem 1rem; cursor: pointer; font-size: 0.85rem; }
  .channels button.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 8px #e0a45833; }
  /* knobs */
  .knobs { display: flex; gap: 1.6rem; flex-wrap: wrap; justify-content: space-around; }
  .knob { display: grid; justify-items: center; gap: 0.3rem; user-select: none; touch-action: none; }
  .knob svg { cursor: ns-resize; }
  .knob .label { font-size: 0.7rem; letter-spacing: 0.14em; color: var(--dim); }
  .knob .value { font-size: 0.75rem; color: var(--accent); min-height: 1em; font-variant-numeric: tabular-nums; }
  /* ir picker */
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line);
           border-radius: 8px; padding: 0.5rem; width: 100%; font-size: 0.85rem; }
  /* meters */
  .meter { display: grid; grid-template-columns: 2.4rem 1fr; align-items: center; gap: 0.6rem;
           margin: 0.3rem 0; font-size: 0.7rem; color: var(--dim); }
  .meter .track { background: #171310; border-radius: 4px; height: 0.55rem; overflow: hidden; }
  .meter .fill { height: 100%; width: 0; background: linear-gradient(90deg, #5a9e5a, #c9c96a 70%, #d87d7d 92%); }
  /* footer */
  footer { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  #muteBtn { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
             border-radius: 8px; padding: 0.6rem 1.4rem; cursor: pointer; }
  #muteBtn.muted { border-color: var(--bad); color: var(--bad); }
  /* metronome (ported from the standalone metronome app, webamp palette) */
  #beatDots { display: flex; justify-content: center; gap: 0.6rem; min-height: 1rem; margin-bottom: 1rem; }
  #beatDots .dot { width: 0.9rem; height: 0.9rem; border-radius: 50%; background: var(--line);
                   transition: all 0.1s ease-out; }
  #beatDots .dot.beat { background: var(--text); transform: scale(1.35); box-shadow: 0 0 14px #e8ddd0aa; }
  #beatDots .dot.accent { background: var(--accent); transform: scale(1.35); box-shadow: 0 0 16px #e0a458cc; }
  .bpmRow { display: flex; align-items: center; justify-content: center; gap: 1.1rem; margin-bottom: 1rem; }
  .bpmRow .round { width: 3rem; height: 3rem; border-radius: 50%; border: 1px solid var(--line);
                   background: var(--panel); color: var(--text); font-size: 1.4rem; cursor: pointer; }
  .bpmRow .round:active { transform: scale(0.95); }
  .bpmBox { display: flex; flex-direction: column; min-width: 8rem; }
  .bpmBox input { background: transparent; border: 0; border-bottom: 2px solid transparent; outline: none;
                  color: var(--text); font-size: 3.2rem; font-weight: 700; text-align: center;
                  font-variant-numeric: tabular-nums; width: 100%; caret-color: var(--accent); }
  .bpmBox input:focus { border-bottom-color: var(--accent); }
  .bpmBox input.range-flash { color: var(--bad); }
  .bpmBox span { font-size: 0.7rem; letter-spacing: 0.2em; color: var(--dim); margin-top: 0.2rem; }
  #metroBtn { width: 100%; max-width: 22rem; background: var(--panel); color: var(--text);
              border: 1px solid var(--line); border-radius: 10px; padding: 0.8rem; font-size: 1rem;
              font-weight: 600; cursor: pointer; margin-bottom: 1rem; }
  #metroBtn.on { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px #e0a45840; }
  .metroOpts { display: flex; gap: 0.8rem; justify-content: center; align-items: end; flex-wrap: wrap;
               margin-bottom: 0.8rem; font-size: 0.7rem; color: var(--dim); letter-spacing: 0.1em; }
  .metroOpts label { display: flex; flex-direction: column; gap: 0.3rem; }
  .metroOpts label.accent { flex-direction: row; align-items: center; cursor: pointer; }
  .metroOpts input[type="number"] { width: 4rem; background: var(--panel); color: var(--text);
                                    border: 1px solid var(--line); border-radius: 8px; padding: 0.45rem;
                                    text-align: center; font-size: 0.9rem; }
  .metroOpts input[type="checkbox"] { accent-color: var(--accent); }
  #tapBtn { background: var(--panel); color: var(--text); border: 1px solid var(--line);
            border-radius: 8px; padding: 0.55rem 1rem; cursor: pointer; font-size: 0.75rem;
            letter-spacing: 0.1em; }
  #tapBtn.flash { border-color: var(--accent); color: var(--accent); }
  .kbd { font-size: 0.68rem; color: var(--dim); }
  .kbd kbd { background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px;
             border-radius: 5px; padding: 0.1rem 0.35rem; color: var(--text); }
  #offline { display: none; text-align: center; padding: 2rem 0; color: var(--dim); }
  #offline.show { display: block; }
  #panel.hidden { display: none; }
</style>
</head>
<body>
<div class="amp">
  <header>
    <h1>WEB<span>AMP</span></h1>
    <div><span id="connDot"></span><span id="connText">connecting…</span></div>
    <div id="engineInfo"></div>
  </header>

  <div id="offline">
    <p><strong>Engine not found.</strong></p>
    <p>Start <code>webamp-helper.exe</code> (look for the tray icon), then this page will reconnect automatically.</p>
  </div>

  <div id="panel">
    <div class="section">
      <h2>Amp model</h2>
      <div class="channels" id="channels"></div>
    </div>

    <div class="section">
      <h2>Controls</h2>
      <div class="knobs" id="knobs"></div>
    </div>

    <div class="section">
      <h2>Metronome</h2>
      <div style="display: flex; gap: 1.6rem; align-items: center; flex-wrap: wrap;">
        <div style="flex: 1 1 22rem; text-align: center;">
          <div id="beatDots" aria-hidden="true"></div>
          <div class="bpmRow">
            <button id="decBtn" class="round" aria-label="Decrease tempo">&minus;</button>
            <div class="bpmBox">
              <input id="bpmValue" type="text" inputmode="numeric" maxlength="3" value="120" aria-label="Tempo in BPM">
              <span>BPM</span>
            </div>
            <button id="incBtn" class="round" aria-label="Increase tempo">+</button>
          </div>
          <button id="metroBtn">▶ START</button>
          <div class="metroOpts">
            <label>STEP <input type="number" id="stepInput" min="1" max="30" value="5"></label>
            <label>BEATS <input type="number" id="beatsInput" min="1" max="12" value="4"></label>
            <button id="tapBtn">TAP TEMPO</button>
            <label class="accent"><input type="checkbox" id="accentToggle" checked> ACCENT 1st</label>
          </div>
          <div class="kbd"><kbd>Space</kbd> start/stop · <kbd>↑</kbd> faster · <kbd>↓</kbd> slower · <kbd>T</kbd> tap · click the number to type</div>
        </div>
        <div id="metroKnob"></div>
      </div>
    </div>

    <div class="row">
      <div class="section" style="flex: 2 1 20rem;">
        <h2>Cabinet IR</h2>
        <select id="irSel"></select>
      </div>
      <div class="section" style="flex: 1 1 14rem;">
        <h2>Levels</h2>
        <div class="meter"><span>IN</span><div class="track"><div class="fill" id="meterIn"></div></div></div>
        <div class="meter"><span>OUT</span><div class="track"><div class="fill" id="meterOut"></div></div></div>
      </div>
    </div>

    <footer>
      <button id="muteBtn">MUTE</button>
      <span id="latencyNote" style="color: var(--dim); font-size: 0.75rem;"></span>
    </footer>
  </div>
</div>

<script>
"use strict";

const PARAMS = [
  { id: "gainIn",  label: "GAIN",   min: 0,    max: 8,  def: 1, fmt: v => v.toFixed(2) },
  { id: "gate",    label: "GATE",   min: -100, max: -20, def: -100, fmt: v => v <= -99 ? "off" : v.toFixed(0) + " dB" },
  { id: "bass",    label: "BASS",   min: -12,  max: 12, def: 0, fmt: v => (v > 0 ? "+" : "") + v.toFixed(1) },
  { id: "mid",     label: "MID",    min: -12,  max: 12, def: 0, fmt: v => (v > 0 ? "+" : "") + v.toFixed(1) },
  { id: "treble",  label: "TREBLE", min: -12,  max: 12, def: 0, fmt: v => (v > 0 ? "+" : "") + v.toFixed(1) },
  { id: "gainOut", label: "VOLUME", min: 0,    max: 4,  def: 1, fmt: v => v.toFixed(2) },
  { id: "metroVol", label: "CLICK", min: 0,    max: 2,  def: 0.5, fmt: v => v.toFixed(2), mount: "metroKnob" },
];

const $ = (id) => document.getElementById(id);
const state = { params: {}, models: [], irs: [], model: "", ir: "" };
let ws = null;
let dragging = null;          // param id being dragged (ignore server echo for it)
const sendQueue = {};         // param -> latest value, flushed per frame
let flushScheduled = false;

// ---- knob widgets ----------------------------------------------------------
const knobEls = {};
function makeKnob(p) {
  const wrap = document.createElement("div");
  wrap.className = "knob";
  wrap.innerHTML = `
    <svg width="72" height="72" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r="30" fill="#171310" stroke="#3a2d24" stroke-width="2"/>
      <path class="arc" d="" fill="none" stroke="#e0a458" stroke-width="4" stroke-linecap="round"/>
      <line class="pointer" x1="36" y1="36" x2="36" y2="12" stroke="#e8ddd0" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="label">${p.label}</div>
    <div class="value">–</div>`;
  const svg = wrap.querySelector("svg");
  const setVisual = (v) => {
    const t = (v - p.min) / (p.max - p.min);
    const ang = -135 + t * 270;
    wrap.querySelector(".pointer").setAttribute("transform", `rotate(${ang} 36 36)`);
    const a0 = (-135 - 90) * Math.PI / 180, a1 = (ang - 90) * Math.PI / 180;
    const large = ang - (-135) > 180 ? 1 : 0;
    wrap.querySelector(".arc").setAttribute("d",
      `M ${36 + 30 * Math.cos(a0)} ${36 + 30 * Math.sin(a0)} A 30 30 0 ${large} 1 ${36 + 30 * Math.cos(a1)} ${36 + 30 * Math.sin(a1)}`);
    wrap.querySelector(".value").textContent = p.fmt(v);
  };
  let startY = 0, startVal = 0;
  svg.addEventListener("pointerdown", (e) => {
    dragging = p.id;
    startY = e.clientY;
    startVal = state.params[p.id] ?? p.def;
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", (e) => {
    if (dragging !== p.id) return;
    const v = Math.min(p.max, Math.max(p.min, startVal + (startY - e.clientY) * (p.max - p.min) / 150));
    state.params[p.id] = v;
    setVisual(v);
    queueParam(p.id, v);
  });
  const endDrag = () => { if (dragging === p.id) dragging = null; };
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  svg.addEventListener("dblclick", () => {
    state.params[p.id] = p.def;
    setVisual(p.def);
    queueParam(p.id, p.def);
  });
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const step = (p.max - p.min) / 100;
    const v = Math.min(p.max, Math.max(p.min, (state.params[p.id] ?? p.def) - Math.sign(e.deltaY) * step * 4));
    state.params[p.id] = v;
    setVisual(v);
    queueParam(p.id, v);
  }, { passive: false });
  knobEls[p.id] = setVisual;
  return wrap;
}
PARAMS.forEach(p => $(p.mount || "knobs").appendChild(makeKnob(p)));

function queueParam(id, value) {
  sendQueue[id] = value;
  if (!flushScheduled) {
    flushScheduled = true;
    // setTimeout, not requestAnimationFrame: rAF suspends in background/embedded
    // tabs and would silently drop parameter changes.
    setTimeout(() => {
      flushScheduled = false;
      if (!ws || ws.readyState !== 1) return;
      for (const [pid, v] of Object.entries(sendQueue))
        ws.send(JSON.stringify({ type: "setParam", id: pid, value: v }));
      for (const k in sendQueue) delete sendQueue[k];
    }, 33);
  }
}

// ---- state application -------------------------------------------------------
function applyState(msg) {
  state.models = msg.models; state.irs = msg.irs;
  state.model = msg.model; state.ir = msg.ir;
  for (const p of PARAMS) {
    if (dragging === p.id) continue;
    state.params[p.id] = msg.params[p.id];
    knobEls[p.id](msg.params[p.id]);
  }
  // channels
  const ch = $("channels");
  ch.innerHTML = "";
  for (const m of state.models) {
    const b = document.createElement("button");
    b.textContent = m.replace(/^MARSHALL JCM800 2210 100W CH\s*/i, "") || m;
    b.title = m;
    b.className = m === state.model ? "active" : "";
    b.onclick = () => ws && ws.send(JSON.stringify({ type: "setModel", name: m }));
    ch.appendChild(b);
  }
  // irs
  const sel = $("irSel");
  if (sel.options.length !== state.irs.length) {
    sel.innerHTML = "";
    for (const ir of state.irs) {
      const o = document.createElement("option");
      o.value = o.textContent = ir;
      sel.appendChild(o);
    }
  }
  sel.value = state.ir;
  // metronome
  const mb = $("metroBtn");
  mb.textContent = msg.params.metroOn ? "■ STOP" : "▶ START";
  mb.className = msg.params.metroOn ? "on" : "";
  state.params.metroOn = msg.params.metroOn;
  state.params.metroBpm = msg.params.metroBpm;
  state.params.metroBeats = msg.params.metroBeats;
  state.params.metroAccent = msg.params.metroAccent;
  if (document.activeElement !== $("bpmValue"))
    $("bpmValue").value = String(Math.round(msg.params.metroBpm));
  if (document.activeElement !== $("beatsInput"))
    $("beatsInput").value = String(msg.params.metroBeats);
  $("accentToggle").checked = !!msg.params.metroAccent;
  renderBeatDots(msg.params.metroBeats);
  // mute + engine info
  $("muteBtn").className = msg.params.mute ? "muted" : "";
  $("muteBtn").textContent = msg.params.mute ? "UNMUTE" : "MUTE";
  $("engineInfo").textContent =
    `${msg.engine.api.toUpperCase()} · ${msg.engine.sampleRate / 1000} kHz · buffer ${msg.engine.buffer} · xruns ${msg.engine.xruns}`;
  // Driver estimate, not a measurement — true round-trip needs a loopback test.
  const lat = msg.engine.reportedLatencyMs;
  $("latencyNote").textContent =
    lat > 0 ? `≈${lat.toFixed(1)} ms round-trip (driver-reported estimate)` : "";
}

$("irSel").addEventListener("change", (e) =>
  ws && ws.send(JSON.stringify({ type: "setIr", name: e.target.value })));
// ---- metronome (UX ported from F:\codework\metronome, engine-clocked) --------
const MIN_BPM = 20, MAX_BPM = 360;
let metroStep = Number(localStorage.getItem("webamp:metroStep")) || 5;
$("stepInput").value = String(metroStep);
let tapTimes = [];
let lastBeatCount = -1;
let rangeFlashTimer = null;

function renderBeatDots(n) {
  const box = $("beatDots");
  if (box.children.length === n) return;
  box.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const d = document.createElement("div");
    d.className = "dot";
    box.appendChild(d);
  }
}
function flashBeat(index) {
  const dots = $("beatDots").children;
  const dot = dots[index % Math.max(1, dots.length)];
  if (!dot) return;
  const cls = (state.params.metroAccent && index === 0) ? "accent" : "beat";
  dot.classList.add(cls);
  setTimeout(() => dot.classList.remove(cls), 90);
}
function setBpm(value) {
  const rounded = Math.round(value);
  const clamped = Math.min(MAX_BPM, Math.max(MIN_BPM, rounded));
  if (clamped !== rounded) {
    $("bpmValue").classList.add("range-flash");
    if (rangeFlashTimer) clearTimeout(rangeFlashTimer);
    rangeFlashTimer = setTimeout(() => $("bpmValue").classList.remove("range-flash"), 500);
  }
  state.params.metroBpm = clamped;
  $("bpmValue").value = String(clamped);
  queueParam("metroBpm", clamped);
}
function nudgeBpm(dir) { setBpm((state.params.metroBpm ?? 120) + dir * metroStep); }
function toggleMetro() {
  ws && ws.send(JSON.stringify({ type: "setParam", id: "metroOn", value: state.params.metroOn ? 0 : 1 }));
}
function tap() {
  const now = performance.now();
  if (tapTimes.length && now - tapTimes[tapTimes.length - 1] > 2000) tapTimes = [];
  tapTimes.push(now);
  if (tapTimes.length > 5) tapTimes.shift();
  if (tapTimes.length >= 2) {
    let sum = 0;
    for (let i = 1; i < tapTimes.length; i++) sum += tapTimes[i] - tapTimes[i - 1];
    setBpm(60000 / (sum / (tapTimes.length - 1)));
  }
  $("tapBtn").classList.add("flash");
  setTimeout(() => $("tapBtn").classList.remove("flash"), 100);
}

$("metroBtn").addEventListener("click", toggleMetro);
$("incBtn").addEventListener("click", () => nudgeBpm(1));
$("decBtn").addEventListener("click", () => nudgeBpm(-1));
$("tapBtn").addEventListener("click", tap);
$("bpmValue").addEventListener("focus", (e) => e.target.select());
$("bpmValue").addEventListener("input", (e) => {
  const digits = e.target.value.replace(/[^0-9]/g, "");
  if (digits !== e.target.value) e.target.value = digits;
});
function commitBpmInput() {
  const parsed = parseInt($("bpmValue").value, 10);
  if (Number.isFinite(parsed)) setBpm(parsed);
  else $("bpmValue").value = String(Math.round(state.params.metroBpm ?? 120));
}
$("bpmValue").addEventListener("change", commitBpmInput);
$("bpmValue").addEventListener("keydown", (e) => {
  if (e.code === "Enter") { e.preventDefault(); commitBpmInput(); e.target.blur(); }
  else if (e.code === "Escape") { e.preventDefault(); $("bpmValue").value = String(Math.round(state.params.metroBpm ?? 120)); e.target.blur(); }
});
$("stepInput").addEventListener("change", (e) => {
  metroStep = Math.min(30, Math.max(1, parseInt(e.target.value, 10) || metroStep));
  e.target.value = String(metroStep);
  localStorage.setItem("webamp:metroStep", String(metroStep));
});
$("beatsInput").addEventListener("change", (e) => {
  const v = Math.min(12, Math.max(1, parseInt(e.target.value, 10) || 4));
  e.target.value = String(v);
  ws && ws.send(JSON.stringify({ type: "setParam", id: "metroBeats", value: v }));
});
$("accentToggle").addEventListener("change", (e) =>
  ws && ws.send(JSON.stringify({ type: "setParam", id: "metroAccent", value: e.target.checked ? 1 : 0 })));
document.addEventListener("keydown", (e) => {
  const editing = e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT");
  const inNumber = e.target === $("stepInput") || e.target === $("beatsInput");
  if (!inNumber && (e.code === "ArrowUp" || e.code === "ArrowDown")) {
    e.preventDefault();
    nudgeBpm(e.code === "ArrowUp" ? 1 : -1);
    return;
  }
  if (editing) return;
  if (e.code === "Space") { e.preventDefault(); toggleMetro(); }
  else if (e.code === "KeyT") { e.preventDefault(); tap(); }
});
$("muteBtn").addEventListener("click", () =>
  ws && ws.send(JSON.stringify({ type: "setParam", id: "mute", value: state.params.mute ? 0 : 1 })));

// ---- connection --------------------------------------------------------------
function setConn(ok, text) {
  $("connDot").className = ok ? "ok" : "";
  $("connText").textContent = text;
  $("offline").className = ok ? "" : "show";
  $("panel").className = ok ? "" : "hidden";
}
function connect() {
  ws = new WebSocket("ws://127.0.0.1:43717");
  ws.onopen = () => { setConn(true, "engine connected"); ws.send(JSON.stringify({ type: "hello" })); };
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === "state") { applyState(msg); if (msg.params.mute !== undefined) state.params.mute = msg.params.mute; }
    else if (msg.type === "meters") {
      $("meterIn").style.width = Math.min(100, Math.sqrt(msg.in) * 110) + "%";
      $("meterOut").style.width = Math.min(100, Math.sqrt(msg.out) * 110) + "%";
      if (msg.beatCount !== lastBeatCount) {
        if (lastBeatCount >= 0 && state.params.metroOn) flashBeat(msg.beatInBar);
        lastBeatCount = msg.beatCount;
      }
    }
  };
  ws.onclose = () => { setConn(false, "engine offline"); setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
}
connect();
</script>
</body>
</html>
